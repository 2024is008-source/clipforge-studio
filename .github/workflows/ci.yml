name: ClipForge CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend-verify:
    name: Frontend Lint, Typecheck & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: TypeScript strict typecheck
        run: npx tsc --noEmit

      - name: Run ESLint
        run: npm run lint

      - name: Run Vitest unit tests
        run: npm test

      - name: Build production bundle
        run: npm run build

  backend-verify:
    name: Python Worker Lint & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install system FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest httpx
          pip install -r local_worker/requirements.txt

      - name: Ruff static analysis
        run: ruff check local_worker engines tests

      - name: Run Python test suites
        run: |
          python -m unittest discover -s tests -p "test_*.py" -v
          python -m unittest local_worker/tests/test_analysis_cache.py local_worker/tests/test_layout_decision.py local_worker/tests/test_speaker_priority.py local_worker/tests/test_segmentation_service.py local_worker/tests/test_detection_service.py local_worker/tests/test_openshorts_and_gemini_pool.py local_worker/tests/test_intelligence_api.py
