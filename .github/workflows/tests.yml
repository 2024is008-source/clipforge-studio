name: Integration & Pipeline QA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  pipeline-qa:
    name: Full Pipeline & Rendering Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install Python test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest httpx
          pip install -r local_worker/requirements.txt
      - name: Run unit, integration, and e2e filtergraph tests
        run: |
          python -m unittest discover -s tests -p "test_*.py" -v
          python -m unittest local_worker/tests/test_hardware_portability.py
          python -m unittest local_worker/tests/test_render_framerate.py
          python -m unittest local_worker/tests/test_render_motion.py
          python -m unittest local_worker/tests/test_fit_preservation.py
