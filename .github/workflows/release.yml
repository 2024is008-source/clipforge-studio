name: Release Automation

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    name: Validate & Publish Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Verify package.json version matches git tag
        run: |
          TAG_VER="${GITHUB_REF_NAME#v}"
          PKG_VER=$(node -p "require('./package.json').version")
          echo "Tag version: $TAG_VER | Package version: $PKG_VER"
          if [ "$TAG_VER" != "$PKG_VER" ]; then
            echo "Version mismatch between git tag ($TAG_VER) and package.json ($PKG_VER)"
            exit 1
          fi

      - name: Run release verification tests
        run: |
          python -m pip install --upgrade pip
          pip install -r local_worker/requirements.txt
          python -m unittest discover -s tests -p "test_*.py" -v

      - name: Package release archive
        run: |
          git archive --format=zip --output="ClipForge-${GITHUB_REF_NAME}.zip" HEAD

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ClipForge-${{ github.ref_name }}.zip
          generate_release_notes: true
